<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OceanLedger IHMM — Login Portal</title>
  <meta name="description" content="OceanLedger IHMM compliance platform and audit portal.">
  <link rel="icon" type="image/webp" href="/ihm-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: #0b1120;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .frame-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      border: none;
      display: flex;
      flex-direction: column;
    }
    #ihm-frame {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      flex: 1;
      display: block;
      background: #0b1120;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b1120;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      color: #94a3b8;
    }
    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 600;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="frame-container">
    <div id="loader" class="loading-overlay">
      <div class="spinner"></div>
      <div class="brand-title">EnviGuide IHM Platform</div>
    </div>
    <iframe
      id="ihm-frame"
      src="http://localhost:5173/"
      allow="clipboard-write; camera; microphone"
      onload="document.getElementById('loader').classList.add('hidden')"
    ></iframe>
  </div>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const iframe = document.getElementById('ihm-frame');
    
    if (isLocal) {
      // Test if local Vite server is running
      fetch('http://localhost:5173/', { mode: 'no-cors' })
        .then(() => {
          if (iframe) iframe.src = 'http://localhost:5173/';
        })
        .catch(() => {
          if (iframe) iframe.src = 'https://ihm-enviguide.vercel.app/';
        });
    } else {
      if (iframe) iframe.src = 'https://ihm-enviguide.vercel.app/';
    }

    // Hide loader after maximum 2.5s
    setTimeout(() => {
      const loader = document.getElementById('loader');
      if (loader) loader.classList.add('hidden');
    }, 2500);
  </script>
</body>
</html>
